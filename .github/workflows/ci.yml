# 軽量CI (Issue #36)
# やること: 移行ツールの単体テスト / 全Pythonファイルの構文チェック / compose検証
# やらないこと: Dockerイメージのビルド、Flywayの実DB適用 (重いので別件)
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 移行ツールは別PC (Windows想定) で動くため Windows でも回す
        os: [ubuntu-latest, windows-latest]
        # 3.10 = 各Dockerfileのベース、3.12 = 手元環境の目安
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Migration tool unit tests
        run: python tools/migration/test_migration_tools.py

      - name: Syntax check (compileall)
        run: python -m compileall -q scraper frontend discord_bot tools

  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Create dummy .env
        run: cp .env.example .env

      - name: Validate compose (default)
        run: docker compose config -q

      - name: Validate compose (external profile)
        run: docker compose --profile external config -q
