# Dependabot 設定 (Issue #38)
# 依存の更新を自動で PR 化する。マージ判断は人間が行い、CI (PR #37) で確認する。
#
# pip の解決に使う Python バージョンはリポジトリルートの .python-version (3.10) から
# 読み取られる。これが無いと Dependabot は最新 Python で解決し、python:3.10-slim では
# 入らないバージョン (pandas 3.x, streamlit 1.66+ など) を提案してしまう。
version: 2
updates:
  # --- Python (pip) ---
  - package-ecosystem: "pip"
    directory: "/scraper"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      scraper-deps:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      frontend-deps:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/discord_bot"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      discord-bot-deps:
        patterns: ["*"]

  # --- Docker ベースイメージ ---
  # Python 自体のバージョンアップ (3.10 -> 3.x) は pandas/streamlit の上限と連動する
  # 意図的な判断なので自動 PR の対象外にし、パッチ更新 (3.10.x) のみ受ける。
  - package-ecosystem: "docker"
    directory: "/scraper"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "docker"
    directory: "/discord_bot"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # --- GitHub Actions ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
